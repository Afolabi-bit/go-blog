basePath: /
definitions:
  authorrequest.AuthorRequest:
    properties:
      bio:
        type: string
      created_at:
        type: string
      id:
        type: string
      motivation:
        type: string
      review_notes:
        type: string
      reviewed_by:
        type: string
      sample_links:
        items:
          type: string
        type: array
      status:
        type: string
      updated_at:
        type: string
      user_email:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  authorrequest.ReviewRequest:
    properties:
      review_notes:
        maxLength: 500
        type: string
      status:
        type: string
    required:
    - status
    type: object
  authorrequest.SubmitRequest:
    properties:
      bio:
        maxLength: 1000
        minLength: 10
        type: string
      motivation:
        maxLength: 2000
        minLength: 10
        type: string
      sample_links:
        items:
          type: string
        type: array
    required:
    - bio
    - motivation
    type: object
  posts.CreatePostRequest:
    properties:
      content:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  posts.Post:
    properties:
      author_id:
        type: string
      author_name:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      slug:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  posts.UpdatePostRequest:
    properties:
      content:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  response.Response:
    properties:
      data:
        description: Optional payload
      message:
        description: Optional human-readable message
        type: string
      status:
        description: '"success" or "error"'
        type: string
    type: object
  user.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/user.PublicUser'
    type: object
  user.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  user.PublicUser:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  user.RegisterRequest:
    properties:
      email:
        type: string
      firstName:
        minLength: 3
        type: string
      lastName:
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
      role:
        type: string
    required:
    - email
    - firstName
    - lastName
    - password
    type: object
host: localhost:5000
info:
  contact:
    email: support@blog.com
    name: API Support
  description: A multi-tenant Blog API with JWT authentication and Role-Based Access
    Control (RBAC).
  termsOfService: http://swagger.io/terms/
  title: Blog REST API
  version: "1.0"
paths:
  /api/admin/author-requests:
    get:
      description: Moderation list of author requests across all users (Admin only)
      parameters:
      - description: 'Filter by status: pending, approved, rejected'
        in: query
        name: status
        type: string
      - description: Limit (default 10, max 20)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List all author applications
      tags:
      - admin
  /api/admin/author-requests/{id}/review:
    patch:
      consumes:
      - application/json
      description: Approve or reject a pending author request. Approving automatically
        elevates user to author role (Admin only).
      parameters:
      - description: Author Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Review decision and notes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authorrequest.ReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/authorrequest.AuthorRequest'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Review an author application
      tags:
      - admin
  /api/admin/posts:
    get:
      description: Lists all posts across all authors and statuses (Admin role required)
      parameters:
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Filter by tag
        in: query
        name: tag
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Admin post moderation list
      tags:
      - admin
  /api/my-posts:
    get:
      description: Lists all posts created by the authenticated author, including
        drafts and published posts
      parameters:
      - description: Limit (default 10, max 20)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Author post dashboard
      tags:
      - posts
  /api/posts:
    get:
      description: Browse published blog posts with search, tag filtering, and cursor
        pagination
      parameters:
      - description: Search keyword in post titles
        in: query
        name: search
        type: string
      - description: Filter by tag
        in: query
        name: tag
        type: string
      - description: Number of posts to return (default 10, max 20)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: List published posts
      tags:
      - posts
    post:
      consumes:
      - application/json
      description: Creates a draft or published post (Author or Admin role required)
      parameters:
      - description: Post creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/posts.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create a new post
      tags:
      - posts
  /api/posts/{id}:
    delete:
      description: Deletes a post. Authors can only delete their own posts; Admins
        can delete any post.
      parameters:
      - description: Post ID (24-char hex MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Delete a post
      tags:
      - posts
    get:
      description: Fetch post details. Published posts are public; draft posts require
        author or admin credentials.
      parameters:
      - description: Post ID (24-char hex MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get a single post by ID
      tags:
      - posts
    patch:
      consumes:
      - application/json
      description: Partially update a post's title, content, or status. Authors can
        only update their own posts; Admins can update any post.
      parameters:
      - description: Post ID (24-char hex MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/posts.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update a post
      tags:
      - posts
  /api/posts/slug/{slug}:
    get:
      description: Fetch post details by slug. Published posts are public; draft posts
        require author or admin credentials.
      parameters:
      - description: Post Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get a single post by slug
      tags:
      - posts
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns a JWT Bearer token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Log in user
      tags:
      - auth
  /auth/logout:
    post:
      description: Logs out the user session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Log out user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account (defaults to reader role)
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: Register a new user
      tags:
      - auth
  /health:
    get:
      description: Check service availability, database connectivity, and system time
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /user/author-request:
    get:
      description: Retrieves the authenticated user's latest author application and
        status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/authorrequest.AuthorRequest'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get current user's author application
      tags:
      - author-requests
    post:
      consumes:
      - application/json
      description: Allows an authenticated reader to apply for author status with
        a bio and sample portfolio links
      parameters:
      - description: Author application details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authorrequest.SubmitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/authorrequest.AuthorRequest'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Submit application to become an author
      tags:
      - author-requests
  /user/iam:
    get:
      description: Returns details of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.PublicUser'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - user
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and your JWT token. Example: "Bearer
      eyJhbGciOi..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
