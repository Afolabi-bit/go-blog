basePath: /
definitions:
  authorrequest.AuthorRequest:
    properties:
      bio:
        type: string
      created_at:
        type: string
      id:
        type: string
      motivation:
        type: string
      review_notes:
        type: string
      reviewed_by:
        type: string
      sample_links:
        items:
          type: string
        type: array
      status:
        type: string
      updated_at:
        type: string
      user_email:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  authorrequest.ReviewRequest:
    properties:
      review_notes:
        maxLength: 500
        type: string
      status:
        type: string
    required:
    - status
    type: object
  authorrequest.SubmitRequest:
    properties:
      bio:
        maxLength: 1000
        minLength: 10
        type: string
      motivation:
        maxLength: 2000
        minLength: 10
        type: string
      sample_links:
        items:
          type: string
        type: array
    required:
    - bio
    - motivation
    type: object
  comments.Comment:
    properties:
      author_id:
        type: string
      author_name:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      parent_id:
        type: string
      post_id:
        type: string
      updated_at:
        type: string
    type: object
  comments.CreateCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 1
        type: string
      parent_id:
        type: string
    required:
    - content
    type: object
  likes.LikeStatus:
    properties:
      liked:
        type: boolean
      likes_count:
        type: integer
    type: object
  media.UploadResponse:
    properties:
      filename:
        type: string
      mime_type:
        type: string
      size:
        type: integer
      url:
        type: string
    type: object
  posts.CreatePostRequest:
    properties:
      content:
        type: string
      cover_image:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  posts.Post:
    properties:
      author_id:
        type: string
      author_name:
        type: string
      comments_count:
        type: integer
      content:
        type: string
      cover_image:
        type: string
      created_at:
        type: string
      id:
        type: string
      likes_count:
        type: integer
      slug:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  posts.UpdatePostRequest:
    properties:
      content:
        type: string
      cover_image:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  response.Response:
    properties:
      data:
        description: Optional payload
      message:
        description: Optional human-readable message
        type: string
      status:
        description: '"success" or "error"'
        type: string
    type: object
  user.AuthResponse:
    properties:
      refresh_token:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/user.PublicUser'
    type: object
  user.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  user.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  user.PublicUser:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  user.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  user.RegisterRequest:
    properties:
      email:
        type: string
      firstName:
        minLength: 3
        type: string
      lastName:
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
      role:
        type: string
    required:
    - email
    - firstName
    - lastName
    - password
    type: object
  user.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        maxLength: 500
        type: string
      first_name:
        maxLength: 50
        minLength: 2
        type: string
      last_name:
        maxLength: 50
        minLength: 2
        type: string
    type: object
host: localhost:5000
info:
  contact:
    email: support@blog.com
    name: API Support
  description: A multi-tenant Blog API with JWT authentication and Role-Based Access
    Control (RBAC).
  termsOfService: http://swagger.io/terms/
  title: Blog REST API
  version: "1.0"
paths:
  /api/admin/author-requests:
    get:
      description: Moderation list of author requests across all users (Admin only)
      parameters:
      - description: 'Filter by status: pending, approved, rejected'
        in: query
        name: status
        type: string
      - description: Limit (default 10, max 20)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List all author applications
      tags:
      - admin
  /api/admin/author-requests/{id}/review:
    patch:
      consumes:
      - application/json
      description: Approve or reject a pending author request. Approving automatically
        elevates user to author role (Admin only).
      parameters:
      - description: Author Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Review decision and notes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authorrequest.ReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/authorrequest.AuthorRequest'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Review an author application
      tags:
      - admin
  /api/admin/posts:
    get:
      description: Lists all posts across all authors and statuses (Admin role required)
      parameters:
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Filter by tag
        in: query
        name: tag
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Admin post moderation list
      tags:
      - admin
  /api/comments/{id}:
    delete:
      description: Deletes a comment (Comment author, Post author, or Admin)
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Delete a comment
      tags:
      - comments
  /api/media/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image file (cover image, inline asset) up to 5MB (Author
        or Admin role required)
      parameters:
      - description: Image file to upload (JPEG, PNG, WebP, GIF)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/media.UploadResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Upload an image asset
      tags:
      - media
  /api/my-posts:
    get:
      description: Lists all posts created by the authenticated author, including
        drafts and published posts
      parameters:
      - description: Limit (default 10, max 20)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Author post dashboard
      tags:
      - posts
  /api/posts:
    get:
      description: Browse published blog posts with search, tag filtering, and cursor
        pagination
      parameters:
      - description: Search keyword in post titles
        in: query
        name: search
        type: string
      - description: Filter by tag
        in: query
        name: tag
        type: string
      - description: Number of posts to return (default 10, max 20)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: List published posts
      tags:
      - posts
    post:
      consumes:
      - application/json
      description: Creates a draft or published post (Author or Admin role required)
      parameters:
      - description: Post creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/posts.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create a new post
      tags:
      - posts
  /api/posts/{id}:
    delete:
      description: Deletes a post. Authors can only delete their own posts; Admins
        can delete any post.
      parameters:
      - description: Post ID (24-char hex MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Delete a post
      tags:
      - posts
    get:
      description: Fetch post details. Published posts are public; draft posts require
        author or admin credentials.
      parameters:
      - description: Post ID (24-char hex MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get a single post by ID
      tags:
      - posts
    patch:
      consumes:
      - application/json
      description: Partially update a post's title, content, or status. Authors can
        only update their own posts; Admins can update any post.
      parameters:
      - description: Post ID (24-char hex MongoDB ObjectID)
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/posts.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update a post
      tags:
      - posts
  /api/posts/{id}/comments:
    get:
      description: Browse paginated comments on a published post
      parameters:
      - description: Post ID
        in: path
        name: id
        type: string
      - description: Number of comments to return (default 10, max 20)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: List comments on a post
      tags:
      - comments
    post:
      consumes:
      - application/json
      description: Add a new comment or nested reply to a published post (authenticated
        users)
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/comments.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/comments.Comment'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Add a comment to a post
      tags:
      - comments
  /api/posts/{id}/like:
    get:
      description: Check whether the current user liked the post and get total likes
        count
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/likes.LikeStatus'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get like status for a post
      tags:
      - posts
    post:
      description: Likes a post if not currently liked, or removes the like if already
        liked (authenticated users)
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/likes.LikeStatus'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Toggle like on a post
      tags:
      - posts
  /api/posts/slug/{slug}:
    get:
      description: Fetch post details by slug. Published posts are public; draft posts
        require author or admin credentials.
      parameters:
      - description: Post Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get a single post by slug
      tags:
      - posts
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns a JWT Bearer token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Log in user
      tags:
      - auth
  /auth/logout:
    post:
      description: Logs out the user session and revokes refresh tokens
      parameters:
      - description: Optional refresh token to revoke
        in: body
        name: request
        schema:
          $ref: '#/definitions/user.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Log out user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges an active refresh token for a new access token and rotated
        refresh token
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account (defaults to reader role)
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: Register a new user
      tags:
      - auth
  /health:
    get:
      description: Check service availability, database connectivity, and system time
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /user/author-request:
    get:
      description: Retrieves the authenticated user's latest author application and
        status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/authorrequest.AuthorRequest'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get current user's author application
      tags:
      - author-requests
    post:
      consumes:
      - application/json
      description: Allows an authenticated reader to apply for author status with
        a bio and sample portfolio links
      parameters:
      - description: Author application details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authorrequest.SubmitRequest'
      produces:
      - application/json
      responses:
        "201":
